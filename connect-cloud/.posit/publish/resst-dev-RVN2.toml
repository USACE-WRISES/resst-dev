# Posit Publisher configuration for the Posit Connect Cloud test mirror of RESST.
#
# The site in this directory is generated by `npm run build:connect`: the same
# code as the GitHub Pages deployment, built with base "/". Never edit the
# built files; rebuild them. GitHub Pages (https://usace-wrises.github.io/resst-dev/)
# remains the canonical site. See docs/DEPLOYMENT.md, "Second host: Posit
# Connect Cloud".
#
# Publisher's first-deploy wizard generated this file with only the files that
# index.html references, and the app then failed with "data/sites.json: HTTP
# 404". The list below names every folder the app serves. Directory entries use
# .gitignore syntax and include everything beneath them.
"$schema" = "https://cdn.posit.co/publisher/schemas/posit-publishing-schema-v3.json"
type = "html"
entrypoint = "index.html"
title = "RESST (Connect Cloud test mirror)"
description = "Reservoir Sustainable Sediment Tool, test mirror of https://usace-wrises.github.io/resst-dev/ on a second host. The GitHub Pages site is canonical."
validate = true
product_type = "connect_cloud"
files = [
    "/index.html",
    "/assets/",
    "/data/",
    "/sediment/",
    "/overlays/",
    "/fonts/",
    "/help/",
    "/favicon.png",
    "/logo.svg",
    "/apple-touch-icon.png",
    "/sediment",
    "/data",
]

[connect_cloud.access_control]
public_access = true
